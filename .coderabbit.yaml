# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Central CodeRabbit configuration for the pyrlyn organization. It applies to every repository
# that has no .coderabbit.yaml of its own (https://docs.coderabbit.ai/configuration/central-configuration).
# CodeRabbit speaks only through review findings: no summary, walkthrough extras, poem, status
# or fortune comments, no unprompted chat replies. Reviews stay on demand. Reviews, tools and
# their findings are unchanged.
reviews:
  auto_review:
    enabled: false
  high_level_summary: false
  review_status: false
  in_progress_fortune: false
  poem: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  request_changes_workflow: false
  auto_assign_reviewers: false
  auto_apply_labels: false
  auto_title_placeholder: ""
  commit_status: true
  fail_commit_status: false
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
chat:
  auto_reply: false
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled
issue_enrichment:
  auto_enrich:
    enabled: false
  art: false
